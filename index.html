<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Жанында</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#f3ecdf; --ink:#1c1915; --muted:#6f675d; --card:#fffaf3ee; --line:#e4d8c6; --lime:#d6ff4a; --rose:#ff6d8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Manrope, sans-serif; }
  button, input, select, textarea { font:inherit; }
  main { max-width:520px; margin:0 auto; min-height:100dvh; padding:14px 14px 108px; }
  h1 { font-size:34px; line-height:.95; letter-spacing:-.04em; margin:4px 0 8px; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:14px; backdrop-filter:blur(10px); }
  input, select, textarea { width:100%; border:1px solid var(--line); background:#fff; border-radius:16px; padding:12px 14px; }
  textarea { min-height:72px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 6px; }
  .btn { width:100%; border:0; border-radius:16px; padding:14px; background:var(--ink); color:#fff; font-weight:800; }
  .btn.lime { background:var(--lime); color:#1c1915; }
  .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .hide { display:none !important; }
  .map-wrap { position:relative; margin-top:12px; }
  svg { width:100%; height:auto; filter:drop-shadow(0 18px 30px #c9b8a066); }
  .zone { cursor:pointer; stroke:#fffaf3; stroke-width:3; transition:transform .2s ease; }
  .zone.on { stroke:#1c1915; stroke-width:4; }
  .pin { position:absolute; transform:translate(-50%,-50%); min-width:34px; height:34px; padding:0 8px; border-radius:999px; background:#1c1915; color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; box-shadow:0 8px 18px #1c191544; }
  .pin.prem { background:var(--rose); }
  .sheet { margin-top:12px; }
  .person, .msg { display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .ava { width:36px; height:36px; border-radius:50%; background:var(--lime); display:grid; place-items:center; font-weight:800; flex:none; }
  .badge { background:#ffe1e8; color:#9d2944; border-radius:999px; padding:2px 8px; font-size:11px; font-weight:800; }
  nav { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); width:min(492px, calc(100% - 20px)); display:flex; gap:6px; padding:6px; background:#fffaf3f2; border:1px solid var(--line); border-radius:22px; }
  nav button { flex:1; border:0; background:transparent; border-radius:16px; padding:12px 4px; font-weight:800; }
  nav button.on { background:var(--ink); color:#fff; }
  .top { display:flex; justify-content:space-between; align-items:end; }
</style>
</head>
<body>
<main>
  <section id="auth">
    <p class="muted">карта своих · 2026</p>
    <h1>Кто сейчас в Кыргызстане.</h1>
    <p class="muted">Не Google. Область — пятно, человек — кружок. Пишешь тем, кто в том же пятне.</p>
    <div class="card">
      <label>Прозвище</label>
      <input id="nick" maxlength="16" placeholder="не настоящее имя" />
      <label>Пароль</label>
      <input id="pass" type="password" placeholder="от 4 знаков" />
      <div class="row">
        <div>
          <label>Область</label>
          <select id="region"></select>
        </div>
        <div>
          <label>Город</label>
          <input id="city" value="Бишкек" />
        </div>
      </div>
      <label>Чем полезен</label>
      <input id="skill" placeholder="математика, аптека, перевод" />
      <button class="btn lime" id="enter" type="button">Открыть карту</button>
    </div>
  </section>

  <section id="app" class="hide">
    <div class="top">
      <div>
        <p class="muted" id="where"></p>
        <h1 id="hello"></h1>
      </div>
      <button class="btn ghost" id="out" type="button" style="width:auto">выйти</button>
    </div>
    <div id="view-map">
      <div class="map-wrap card">
        <svg viewBox="0 0 640 380" id="kg">
          <rect width="640" height="380" rx="28" fill="#efe4d2" />
          <ellipse cx="470" cy="150" rx="78" ry="28" fill="#9fd4ea" />
          <text x="470" y="154" text-anchor="middle" font-size="12" fill="#24566a">Ысык-Көл</text>
        </svg>
        <div id="pins"></div>
      </div>
      <div class="card sheet">
        <h2 id="room-title" style="margin:0 0 6px">Комната</h2>
        <p class="muted" id="room-note"></p>
        <div id="people"></div>
      </div>
    </div>
    <div id="view-chat" class="hide">
      <div class="card">
        <h2 style="margin-top:0">Комната области</h2>
        <div id="msgs"></div>
        <textarea id="text" maxlength="240" placeholder="Что нужно или чем поможешь"></textarea>
        <button class="btn" id="send" type="button">Отправить</button>
      </div>
    </div>
    <div id="view-me" class="hide">
      <div class="card">
        <h2 id="me-name" style="margin-top:0"></h2>
        <p id="me-skill"></p>
        <div id="ach"></div>
        <p class="muted">Премиум не покупает место на карте. Он даёт розовый кружок и длинное сообщение. Деньги вводятся снаружи, сюда только код.</p>
        <input id="code" placeholder="код хозяина сайта" />
        <button class="btn lime" id="prem" type="button">Открыть премиум</button>
      </div>
    </div>
  </section>
</main>
<nav id="bar" class="hide">
  <button class="on" id="tab-map" type="button">Карта</button>
  <button id="tab-chat" type="button">Чат</button>
  <button id="tab-me" type="button">Я</button>
</nav>
<script>
const REGIONS = [
  { id:"talas", name:"Талас", color:"#d7ee8a", d:"M70 70 L150 58 L168 110 L120 132 L62 108 Z", x:28, y:22 },
  { id:"chuy", name:"Чүй", color:"#b7e0cf", d:"M150 58 L280 48 L300 108 L168 110 Z", x:38, y:16 },
  { id:"bishkek", name:"Бишкек", color:"#ffe08a", d:"M214 78 L248 74 L252 102 L216 106 Z", x:34, y:22 },
  { id:"issyk", name:"Ысык-Көл", color:"#8ecae6", d:"M300 48 L520 40 L560 120 L430 150 L300 108 Z", x:68, y:20 },
  { id:"naryn", name:"Нарын", color:"#f0c7a4", d:"M250 150 L430 150 L500 230 L280 240 Z", x:52, y:48 },
  { id:"jalal", name:"Жалал-Абад", color:"#f3b7a6", d:"M120 132 L250 150 L280 240 L150 250 L90 190 Z", x:28, y:48 },
  { id:"osh", name:"Ош", color:"#d9c6f5", d:"M90 190 L150 250 L230 300 L80 310 Z", x:20, y:68 },
  { id:"oshcity", name:"Ош шаары", color:"#ff8fab", d:"M168 268 L196 262 L202 286 L170 292 Z", x:27, y:72 },
  { id:"batken", name:"Баткен", color:"#f2d56b", d:"M40 210 L90 190 L80 310 L30 280 Z", x:8, y:66 }
];
const TOPIC = "janynda-kg-2026";
const PREMIUM = "61-ordo";
const KEY = "janynda-me";
let me = JSON.parse(localStorage.getItem(KEY) || "null");
let people = {};
let msgs = [];
let room = me?.region || "bishkek";
const sel = document.getElementById("region");
REGIONS.forEach(r => { const o = document.createElement("option"); o.value = r.id; o.textContent = r.name; sel.appendChild(o); });
function save(){ localStorage.setItem(KEY, JSON.stringify(me)); }
function regionBy(id){ return REGIONS.find(r => r.id === id) || REGIONS[2]; }
const LABELS = { talas:[110,96], chuy:[220,82], bishkek:[233,96], issyk:[430,92], naryn:[360,198], jalal:[185,195], osh:[145,275], oshcity:[184,280], batken:[58,255] };
function drawMap(){
  const svg = document.getElementById("kg");
  [...svg.querySelectorAll(".zone, .lab")].forEach(n => n.remove());
  REGIONS.forEach(r => {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", r.d); p.setAttribute("fill", r.color); p.setAttribute("class", "zone" + (r.id === room ? " on" : ""));
    p.onclick = () => { room = r.id; if (me) { me.region = r.id; save(); } drawMap(); draw(); };
    svg.appendChild(p);
    const [x,y] = LABELS[r.id];
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", "lab"); t.setAttribute("x", x); t.setAttribute("y", y);
    t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", "13"); t.setAttribute("font-weight", "800"); t.setAttribute("fill", "#1c1915");
    t.textContent = r.name; svg.appendChild(t);
  });
  const pins = document.getElementById("pins");
  pins.innerHTML = "";
  const now = Date.now();
  Object.values(people).filter(p => now - p.t < 120000).forEach(p => {
    const r = regionBy(p.region);
    const el = document.createElement("div");
    el.className = "pin" + (p.premium ? " prem" : "");
    el.style.left = r.x + "%"; el.style.top = r.y + "%";
    el.textContent = p.nick.slice(0, 2);
    el.title = p.nick;
    el.onclick = () => { room = p.region; drawMap(); tab("chat"); };
    pins.appendChild(el);
  });
}
function showApp(on){
  document.getElementById("auth").classList.toggle("hide", on);
  document.getElementById("app").classList.toggle("hide", !on);
  document.getElementById("bar").classList.toggle("hide", !on);
  if (!on) return;
  document.getElementById("where").textContent = regionBy(me.region).name + " · " + me.city;
  document.getElementById("hello").textContent = me.nick;
  document.getElementById("me-name").innerHTML = me.nick + (me.premium ? ' <span class="badge">премиум</span>' : "");
  document.getElementById("me-skill").textContent = me.skill || "пока не сказал, чем полезен";
  document.getElementById("ach").innerHTML = (me.ach || []).map(a => `<div class="person"><div class="ava">+</div><div>${a}</div></div>`).join("");
  drawMap(); draw();
}
document.getElementById("enter").onclick = () => {
  const nick = document.getElementById("nick").value.trim();
  const pass = document.getElementById("pass").value;
  if (nick.length < 3 || pass.length < 4) return;
  me = me && me.nick === nick ? me : { nick, premium:false, ach:["открыл карту"] };
  me.region = document.getElementById("region").value;
  me.city = document.getElementById("city").value.trim() || "Бишкек";
  me.skill = document.getElementById("skill").value.trim();
  me.pass = pass;
  room = me.region;
  save(); showApp(true); beat();
};
document.getElementById("out").onclick = () => { me = null; localStorage.removeItem(KEY); showApp(false); };
function tab(name){
  ["map","chat","me"].forEach(id => {
    document.getElementById("view-"+id).classList.toggle("hide", id !== name);
    document.getElementById("tab-"+id).classList.toggle("on", id === name);
  });
}
document.getElementById("tab-map").onclick = () => tab("map");
document.getElementById("tab-chat").onclick = () => tab("chat");
document.getElementById("tab-me").onclick = () => tab("me");
async function publish(obj){ await fetch("https://ntfy.sh/" + TOPIC, { method:"POST", body: JSON.stringify(obj) }); }
function beat(){ if (me) publish({ kind:"here", nick:me.nick, region:me.region, city:me.city, skill:me.skill, premium:!!me.premium, t:Date.now() }); }
document.getElementById("send").onclick = async () => {
  const text = document.getElementById("text").value.trim();
  if (!text || !me) return;
  await publish({ kind:"say", nick:me.nick, region:room, premium:!!me.premium, text:text.slice(0, me.premium ? 240 : 80), t:Date.now() });
  if (!me.ach.includes("написал своим")) me.ach.push("написал своим");
  save(); document.getElementById("text").value = ""; showApp(true);
};
document.getElementById("prem").onclick = () => {
  if (document.getElementById("code").value.trim() !== PREMIUM) { alert("Код не тот. Его даёт хозяин после оплаты снаружи."); return; }
  me.premium = true;
  if (!me.ach.includes("премиум")) me.ach.push("премиум");
  save(); showApp(true); beat();
};
function draw(){
  const now = Date.now();
  const here = Object.values(people).filter(p => now - p.t < 120000 && p.region === room);
  document.getElementById("room-title").textContent = regionBy(room).name;
  document.getElementById("room-note").textContent = here.length ? here.length + " онлайн в этом пятне" : "в пятне тихо. второй телефон появится кружком.";
  document.getElementById("people").innerHTML = here.map(p => `<div class="person"><div class="ava">${p.nick.slice(0,1)}</div><div><b>${p.nick}</b> ${p.premium ? '<span class="badge">премиум</span>' : ""}<br><span class="muted">${p.city} · ${p.skill || "молчит"}</span></div></div>`).join("") || "";
  document.getElementById("msgs").innerHTML = msgs.filter(m => m.region === room).slice(-20).map(m => `<div class="msg"><div class="ava">${m.nick.slice(0,1)}</div><div><b>${m.nick}</b><br>${m.text}</div></div>`).join("") || "<p class='muted'>Комната пустая.</p>";
}
async function pull(){
  try {
    const res = await fetch("https://ntfy.sh/" + TOPIC + "/json?poll=1&since=30m");
    const raw = await res.text();
    raw.split("\n").forEach(line => {
      if (!line.trim()) return;
      try {
        const obj = JSON.parse(JSON.parse(line).message || "{}");
        if (obj.kind === "here") people[obj.nick] = obj;
        if (obj.kind === "say" && !msgs.some(m => m.t === obj.t && m.nick === obj.nick)) msgs.push(obj);
      } catch (e) {}
    });
    if (me) { drawMap(); draw(); }
  } catch (e) {}
}
if (me && me.nick) showApp(true);
setInterval(() => { if (me) beat(); pull(); }, 8000);
pull();
</script>
</body>
</html>
